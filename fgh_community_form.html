<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FGH - Присоединяйся к сообществу!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #1a1a1a;
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
        }

        .profile-avatar {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #f9ca24);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.1);
            font-size: 48px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .profile-avatar::before {
            content: "FGH";
            position: relative;
            z-index: 1;
        }

        /* Контейнер для названия сообщества */
        .profile-header {
            margin-bottom: 10px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #f9ca24);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin: 0;
        }

        .subtitle {
            color: #ccc;
            margin-bottom: 30px;
            font-size: 16px;
            line-height: 1.5;
            padding: 0 10px;
        }

        .section-title {
            color: #fff;
            font-size: 20px;
            margin: 30px 0 15px;
            font-weight: 600;
        }

        .button-group {
            margin-bottom: 20px;
        }

        .button {
            width: 100%;
            background: linear-gradient(135deg, #333, #444);
            border: 1px solid #555;
            color: #fff;
            padding: 18px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
        }

        .button:hover {
            background: linear-gradient(135deg, #444, #555);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.1);
            border-color: #666;
        }

        .button:active {
            transform: translateY(0);
            background: linear-gradient(135deg, #555, #666);
        }

        /* Иконки в кнопках */
        .button-icon {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Discord иконка - теперь содержит SVG */
        .discord-icon {
            background: #5865F2;
            color: white;
            font-weight: bold;
            font-size: 14px;
            padding: 2px;
        }

        .discord-icon svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* VKontakte иконка */
        .vk-icon {
            background: #4C75A3;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }

        .highlight {
            color: #4ecdc4;
            font-weight: 600;
        }

        /* Дополнительные стили для адаптивности */
        @media (max-width: 480px) {
            .container {
                margin: 10px;
                padding: 20px 15px;
            }

            .profile-avatar {
                width: 100px;
                height: 100px;
                font-size: 36px;
            }

            h1 {
                font-size: 24px;
            }

            .subtitle {
                font-size: 14px;
            }

            .button {
                gap: 12px;
                padding: 16px 18px;
            }

            .button-icon {
                width: 22px;
                height: 22px;
            }

            .discord-icon svg {
                width: 18px;
                height: 18px;
            }
        }

        /* Анимация появления */
        .container {
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { 
                opacity: 0;
                transform: translateY(20px);
            }
            to { 
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Эффект для заголовка */
        h1 {
            animation: gradientShift 3s ease-in-out infinite;
            background-size: 200% 200%;
        }

        @keyframes gradientShift {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-avatar"></div>

        <div class="profile-header">
            <h1>FGH Community</h1>
        </div>

        <div class="subtitle">
            🎮 Присоединяйся к нашему игровому сообществу! 🎮<br><br>
            Здесь ты найдешь <span class="highlight">помощь</span> от опытных игроков, встретишь <span class="highlight">единомышленников</span> и сможешь участвовать в <span class="highlight">интересном общении</span> по любимой игре.
        </div>

        <div class="section-title">Наши сообщества</div>
        <div class="button-group">
            <a class="button" href="https://discord.gg/3n37wU7sVE" target="_blank" onclick="trackClick('Discord')">
                <div class="button-icon discord-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 512">

                    </svg>
                </div>
                Присоединиться к Discord серверу
            </a>
            <a class="button" href="https://vk.com/fgh_home" target="_blank" onclick="trackClick('VKontakte')">
                <div class="button-icon vk-icon">VK</div>
                Подписаться на группу ВКонтакте
            </a>
        </div>
    </div>

    <script>
        // Добавляем интерактивность к кнопкам
        document.addEventListener('DOMContentLoaded', function() {
            const buttons = document.querySelectorAll('.button');

            buttons.forEach(button => {
                button.addEventListener('mouseenter', function() {
                    this.style.boxShadow = '0 8px 25px rgba(255, 255, 255, 0.15)';
                });

                button.addEventListener('mouseleave', function() {
                    this.style.boxShadow = '';
                });
            });
        });

        // Функция для отслеживания кликов (можно добавить аналитику)
        function trackClick(platform) {
            console.log(`Переход в сообщество: ${platform}`);
            // Здесь можно добавить отправку аналитики
        }
    </script>
</body>
</html>
